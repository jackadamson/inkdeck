name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux is the permanent cross-machine determinism gate (goldens were
    # recorded on macOS arm64); macOS runs the CF/IOKit suites.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:examples
